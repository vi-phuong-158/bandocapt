name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Đồng bộ với Node.js 24.x được dự án sử dụng cho local (.nvmrc, package.json
          # engines.node) và production. Gác cổng bằng phiên bản khác với nơi chạy thật
          # thì cổng đó không có giá trị.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
